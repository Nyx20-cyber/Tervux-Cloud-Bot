name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend-vps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e
            cd ~/Tervux-Cloud-Bot

            # Preserve server-local runtime config before repo reset
            mkdir -p /tmp/tervux-deploy-backup
            [ -f deploy/env/backend.env ] && cp deploy/env/backend.env /tmp/tervux-deploy-backup/backend.env || true
            [ -f deploy/env/cookies.txt ] && cp deploy/env/cookies.txt /tmp/tervux-deploy-backup/cookies.txt || true
            [ -f deploy/nginx/nginx.conf ] && cp deploy/nginx/nginx.conf /tmp/tervux-deploy-backup/nginx.conf || true

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Merge server-local runtime config with new repo template keys.
            mkdir -p deploy/env
            if [ -f /tmp/tervux-deploy-backup/backend.env ]; then
              cp deploy/env/backend.env.example deploy/env/backend.env.merged
              while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in
                  ''|'#'*) continue ;;
                  *=*)
                    key="${line%%=*}"
                    value="${line#*=}"
                    if grep -q "^${key}=" deploy/env/backend.env.merged; then
                      sed -i "s|^${key}=.*|${key}=${value}|" deploy/env/backend.env.merged
                    else
                      printf '%s\n' "${key}=${value}" >> deploy/env/backend.env.merged
                    fi
                    ;;
                esac
              done < /tmp/tervux-deploy-backup/backend.env
              mv deploy/env/backend.env.merged deploy/env/backend.env
            elif [ ! -f deploy/env/backend.env ]; then
              cp deploy/env/backend.env.example deploy/env/backend.env
            fi
            [ -f /tmp/tervux-deploy-backup/cookies.txt ] && cp /tmp/tervux-deploy-backup/cookies.txt deploy/env/cookies.txt || true
            [ -f deploy/env/cookies.txt ] || touch deploy/env/cookies.txt
            [ -f /tmp/tervux-deploy-backup/nginx.conf ] && cp /tmp/tervux-deploy-backup/nginx.conf deploy/nginx/nginx.conf || true

            cd deploy
            # Clean stale/orphan containers created by old compose runs (v1/v2 mixed naming)
            docker ps -a --format '{{.Names}}' | grep -E '^[a-f0-9]{12}_tervux-(mongo|redis|backend|nginx)$' | xargs -r docker rm -f || true

            docker compose -f docker-compose.production.yml --env-file .env up -d mongo redis
            docker compose -f docker-compose.production.yml --env-file .env up -d --build backend
            docker compose -f docker-compose.production.yml --env-file .env up -d nginx
            docker compose -f docker-compose.production.yml ps
          EOF
