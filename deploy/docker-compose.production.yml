version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: tervux-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    networks:
      - tervux_net

  redis:
    image: redis:7-alpine
    container_name: tervux-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - tervux_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tervux-backend
    restart: unless-stopped
    env_file:
      - ./env/backend.env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./env/cookies.txt:/app/cookies.txt:ro
    networks:
      - tervux_net

  nginx:
    image: nginx:1.27-alpine
    container_name: tervux-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - tervux_net

volumes:
  mongo_data:
  redis_data:

networks:
  tervux_net:
    driver: bridge
